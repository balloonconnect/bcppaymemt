<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Delivery · Balloon Connect Photography</title>
  <meta name="description" content="Pay your balance and download your photos from Balloon Connect Photography.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F26A21">
  <link rel="icon" href="assets/logo-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="assets/logo-180.png">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/logo-192.png" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" tabindex="-1">
    <!-- Screen 1 — Customer photo delivery -->
    <section id="screen-customer" class="screen" aria-live="polite" hidden></section>
    <!-- Screen 2 — Admin payment review (private, opened at #/admin) -->
    <section id="screen-admin" class="screen" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Payment screenshot" hidden>
    <button type="button" class="lightbox-close" aria-label="Close screenshot">×</button>
    <img alt="Payment screenshot, full size">
  </div>

  <noscript><p class="noscript">This page needs JavaScript to show your photo delivery details.</p></noscript>

  <script src="config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="js/core.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
